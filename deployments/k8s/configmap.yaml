    snapshot_interval_seconds: 30
    swim_interval: 1
    swim_probe_timeout: 2
    swim_suspect_to_dead: 3
    auth_enabled: false
    api_key: ""
    rate_limit_per_second: 0
    compression_enabled: true
    tracing_enabled: false
    trace_endpoint: jaeger.distributed-counter.svc.cluster.local:4317
    trace_sample_ratio: 1.0
    counter_shards: 3
    node_priority: 3
    election_interval: 2
    seed_nodes:
      - counter-0.counter.distributed-counter.svc.cluster.local:50051
      - counter-1.counter.distributed-counter.svc.cluster.local:50051
