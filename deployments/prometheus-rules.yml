groups:
  - name: recovery.rules
    rules:
      - alert: RecoverySeedFailuresHigh
        expr: sum by (node_id, seed_node) (increase(recovery_seed_failures_total[10m])) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Recovery seed failures are high"
          description: "Node {{ $labels.node_id }} has repeated recovery failures against seed {{ $labels.seed_node }} in the last 10 minutes."

      - alert: RecoveryRetryStorm
        expr: sum by (node_id) (increase(recovery_retry_total[10m])) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Recovery retry storm detected"
          description: "Node {{ $labels.node_id }} is retrying recovery too often."

      - alert: RecoverySyncTooSlow
        expr: histogram_quantile(0.95, sum by (le, node_id, seed_node) (rate(recovery_sync_duration_seconds_bucket[5m]))) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Recovery sync is slow"
          description: "Recovery sync p95 for node {{ $labels.node_id }} against seed {{ $labels.seed_node }} exceeds 5 seconds."

      - alert: RecoveryStuck
        expr: recovery_in_progress == 1
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Recovery is stuck"
          description: "Node {{ $labels.node_id }} has been in recovery mode for more than 3 minutes."