syntax = "proto3";

package counter;

option go_package = "github.com/VeryFach/distributed-counter/api/proto;counter";

// Main Counter Service
service CounterService {
    // Client API - Unary Calls
    rpc Increment(IncrementRequest) returns (CounterResponse);
    rpc Decrement(DecrementRequest) returns (CounterResponse);
    rpc GetValue(GetValueRequest) returns (CounterResponse);
    rpc GetNodeInfo(GetNodeInfoRequest) returns (NodeInfo);
    rpc Reset(ResetRequest) returns (CounterResponse);

    // Multi-counter API
    rpc CreateCounter(CreateCounterRequest) returns (CounterInfo);
    rpc ListCounters(ListCountersRequest) returns (ListCountersResponse);
    
    // Cluster Communication - Bidirectional Streaming
    rpc SyncState(stream StateUpdate) returns (stream StateUpdate);
    
    // Membership Management - Server Streaming
    rpc JoinCluster(JoinRequest) returns (stream MemberList);
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

    // SWIM Failure Detector
    rpc SwimPing(SwimPingRequest) returns (SwimPingResponse);
    rpc SwimPingReq(SwimPingReqRequest) returns (SwimPingReqResponse);
}

// Member lifecycle states used by the gossip membership protocol.
enum MemberStatus {
    MEMBER_ALIVE = 0;
    MEMBER_SUSPECT = 1;
    MEMBER_DEAD = 2;
    MEMBER_LEFT = 3;
}

// Request & Response Messages
message IncrementRequest {
    int32 delta = 1;  // how much to increment (default: 1)
    string client_id = 2;
    int64 timestamp = 3;
    string counter_name = 4;  // which counter to update (default: "default")
}

message DecrementRequest {
    int32 delta = 1;
    string client_id = 2;
    int64 timestamp = 3;
    string counter_name = 4;  // which counter to update (default: "default")
}

message GetValueRequest {
    string node_id = 1;  // optional: get value from specific node
    string counter_name = 2;  // which counter to read (default: "default")
}

message ResetRequest {
    string node_id = 1;  // optional: which node's counter to reset
    string counter_name = 2;  // which counter to reset (default: "default")
}

message GetNodeInfoRequest {}

message CounterResponse {
    string node_id = 1;
    int64 current_value = 2;
    string version = 3;          // Vector Clock representation
    int64 last_updated = 4;      // Unix timestamp
    repeated NodeInfo cluster_nodes = 5;
    string counter_name = 6;     // which counter this response is for
}

// Multi-counter messages
message CreateCounterRequest {
    string name = 1;             // counter name (e.g. "post_1"); empty = "default"
    repeated string tags = 2;    // optional tags, e.g. "likes", "views"
}

message CounterInfo {
    string name = 1;
    int64 current_value = 2;
    uint32 shard = 3;            // deterministic shard assignment
    repeated string tags = 4;
}

message ListCountersRequest {
    string tag = 1;              // optional: only counters carrying this tag
}

message ListCountersResponse {
    repeated CounterInfo counters = 1;
}

message NodeInfo {
    string node_id = 1;
    string address = 2;
    int64 counter_value = 3;
    string version = 4;
    bool is_leader = 5;
    int64 last_seen = 6;
}

// Gossip Protocol Messages
message StateUpdate {
    string from_node_id = 1;

    map<string,int64> positive_state = 2;
    map<string,int64> negative_state = 3;
    map<string,int64> vector_clock = 4;

    int64 timestamp = 5;

    enum UpdateType {
        FULL_STATE = 0;
        DELTA_UPDATE = 1;
        HEARTBEAT = 2;
    }

    UpdateType type = 6;

    // Version of the sender's state (max vector clock value). Lets the
    // receiver skip redundant merges and enables delta-only gossip.
    int64 last_sync_version = 7;

    // Membership gossip: node_id -> lifecycle status. Lets Suspect/Dead
    // transitions propagate through the cluster without a dedicated RPC.
    map<string, MemberStatus> membership = 8;
}

// Membership Messages
message JoinRequest {
    string node_id = 1;
    string address = 2;
    int64 startup_time = 3;
}

message MemberList {
    repeated Member members = 1;
    int64 version = 2;
}

message Member {
    string node_id = 1;
    string address = 2;
    bool is_active = 3;
    int64 last_heartbeat = 4;
    int64 counter_value = 5;
    MemberStatus status = 6;
}

message HeartbeatRequest {
    string node_id = 1;
    int64 current_value = 2;
    int64 timestamp = 3;
    string address = 4;
}

message HeartbeatResponse {
    bool success = 1;
    string message = 2;
    int64 cluster_size = 3;
    repeated Member active_members = 4;
}

// SWIM failure detector messages
message SwimPingRequest {
    string from_node_id = 1;
    string target_node_id = 2;
    int64 message_id = 3;
}

message SwimPingResponse {
    string node_id = 1;
    bool alive = 2;
    int64 message_id = 3;
}

message SwimPingReqRequest {
    string from_node_id = 1;
    string target_node_id = 2;
    int64 message_id = 3;
}

message SwimPingReqResponse {
    string node_id = 1;
    bool alive = 2;
    int64 message_id = 3;
}